<!DOCTYPE html>
<!-- TEMPLATE for talk-deepread pages. Copy, fill every {{…}}, delete all comments that start with TEMPLATE.
     Do not add comments.js / search.js / index-button.js / i18n-tts.js / lightbox.js (auto-injected),
     and do not add data-tts attributes (the TTS bake writes them). The English page mirrors this file
     with lang="en", English labels (Short / Full) and a langbar link reading 中文 →. -->
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{{演讲者}} ·《{{演讲题目}}》— {{一句钩子}}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"SF Pro Display","Noto Sans SC",sans-serif;background:#0e1311;color:#b6c2cf;line-height:1.85;font-size:16.5px}
.wrap{max-width:760px;margin:0 auto;padding:20px 20px 80px}
.langbar{display:flex;justify-content:flex-end;padding-top:14px;font-family:"SF Mono",Menlo,monospace;font-size:.8rem}
.langbar a{color:#5ee6a8;text-decoration:none;border:1px solid rgba(94,230,168,.28);padding:4px 12px;border-radius:20px}
.langbar a:hover{border-color:#e8d46b;color:#e8d46b}
header{padding:34px 0 8px;border-bottom:1px solid rgba(94,230,168,.16)}
header .kicker{font-family:"SF Mono",Menlo,monospace;font-size:.76rem;color:#e8d46b;letter-spacing:1.4px;text-transform:uppercase}
header h1{font-size:1.95rem;line-height:1.35;font-weight:800;margin-top:10px;background:linear-gradient(135deg,#5ee6a8 0%,#e8d46b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header .sub{margin-top:10px;color:#7d8794;font-size:.92rem}
.modebar{display:flex;gap:8px;margin:22px 0 8px;padding:5px;background:rgba(255,255,255,.03);border:1px solid rgba(94,230,168,.14);border-radius:24px;width:fit-content}
.modebar button{background:none;border:none;color:#7d8794;font:inherit;font-size:.86rem;font-weight:600;padding:6px 18px;border-radius:20px;cursor:pointer;transition:all .15s}
.modebar button.on{background:linear-gradient(135deg,rgba(94,230,168,.22),rgba(232,212,107,.18));color:#d5dce4;box-shadow:inset 0 0 0 1px rgba(232,212,107,.28)}
h2{font-size:1.24rem;color:#d5dce4;margin:44px 0 14px;padding-left:13px;border-left:3px solid #5ee6a8;line-height:1.45}
h3{font-size:1.04rem;color:#e8d46b;margin:30px 0 10px}
p{margin:15px 0}
strong{color:#e2e8f0}
a{color:#5ee6a8;text-decoration:none;border-bottom:1px solid rgba(94,230,168,.3)}
a:hover{color:#e8d46b;border-color:#e8d46b}
blockquote{margin:20px 0;padding:16px 20px;background:rgba(255,255,255,.035);border-left:3px solid #e8d46b;border-radius:0 8px 8px 0;color:#c8d2dc}
blockquote .en{display:block;font-style:italic;color:#93a1ae;font-size:.94rem;line-height:1.7}
blockquote .zh{display:block;margin-top:9px}
blockquote cite{display:block;margin-top:10px;font-style:normal;font-size:.8rem;color:#7d8794;font-family:"SF Mono",Menlo,monospace}
.glossary{border:1px dashed rgba(232,212,107,.35);border-radius:12px;padding:16px 22px;margin:22px 0;background:rgba(232,212,107,.03)}
.glossary ul{list-style:none;margin-left:0}
.glossary li{margin:9px 0;font-size:.93rem}
.glossary b{color:#e8d46b}
.meta-card{font-family:"SF Mono",Menlo,monospace;font-size:.85rem;line-height:1.9;color:#93a1ae;border:1px solid rgba(94,230,168,.22);border-radius:10px;padding:14px 20px;margin:20px 0;background:rgba(94,230,168,.04)}
.meta-card b{color:#e8d46b;font-weight:600}
figure{margin:28px 0}
figcaption{font-size:.83rem;color:#7d8794;margin-top:10px;text-align:center;font-family:"SF Mono",Menlo,monospace}
svg{width:100%;height:auto;display:block}
ol,ul{margin:14px 0 14px 22px}
li{margin:8px 0}
.reads{margin-left:0}
.reads li{margin:16px 0;list-style:none}
.reads .t{font-weight:700;color:#d5dce4}
.reads .d{font-size:.9rem;color:#9aa6b2;display:block;margin-top:3px}
footer{margin-top:46px;padding-top:18px;border-top:1px solid rgba(94,230,168,.14);font-size:.82rem;color:#5f6b77;font-family:"SF Mono",Menlo,monospace}
.fate{border:1px solid rgba(232,212,107,.3);border-radius:10px;padding:4px 20px;margin:20px 0;background:rgba(232,212,107,.04)}
.fate .verdict{font-family:"SF Mono",Menlo,monospace;font-size:.8rem;color:#e8d46b;letter-spacing:1px;margin-top:12px}
[hidden]{display:none!important}
@media(max-width:640px){body{font-size:16px}header h1{font-size:1.5rem}}
</style>
</head><body>
<div class="wrap">
<div class="langbar"><a href="{{slug}}-talk{{N}}.en.html">English →</a></div>
<header>
<div class="kicker">{{场合}} · {{年份}}</div>
<h1>{{钩子标题}}</h1>
<p class="sub">{{演讲者}} ·《{{演讲题目}}》</p>
<div class="modebar"><button id="btn-pop" class="on">精华版</button><button id="btn-deep">完整版</button></div>
</header>

<div class="mode-pop" id="mode-pop">
<!-- TEMPLATE 短版 ~800 字：一篇一口气读完的短文，不是摘要。 -->
</div>

<div class="mode-deep" id="mode-deep" hidden>
<div class="meta-card"><b>演讲</b> {{题目}} · <b>场合</b> {{场合 · 年份}} · <b>时长</b> {{分钟}} · <b>全文</b> <a href="{{逐字稿 URL}}">{{来源}}</a></div>
<h2>那一刻</h2>
<h2>讲的人，和那一年</h2>
<!-- TEMPLATE 可选：<h2>术语表 · Glossary</h2><div class="glossary"><ul><li><b>词</b>：一句大白话</li></ul></div> -->
<h2>这场演讲，讲透</h2>
<!-- TEMPLATE 引语形状（英文演讲）：
<blockquote><span class="en">原文</span><span class="zh">中译</span><cite>— 演讲者，《题目》，年份</cite></blockquote>
     中文演讲只放 <span class="zh">原文</span> + cite。 -->
<h2>冰山下面</h2>
<h2>后来的命运</h2>
<div class="fate"><p class="verdict">{{VERDICT：站住了 / 部分站住 / 被推翻 / 被滥用 / 仍悬而未决}} · 截至 {{YYYY-MM}}</p><p>{{一两句判词}}</p></div>
<h2>出处</h2>
<ul class="reads">
<li><span class="t"><a href="{{URL}}">{{标题}}</a></span><span class="d">{{它是什么、支撑了本页哪一处}}</span></li>
</ul>
</div>
<footer>演讲精读 · 一场演讲，一个想法的来龙去脉 · 写于 {{YYYY-MM-DD}}</footer>
</div>
<script>
(function(){
  var pop=document.getElementById('mode-pop'),deep=document.getElementById('mode-deep');
  var bp=document.getElementById('btn-pop'),bd=document.getElementById('btn-deep');
  function set(m){
    var isDeep=(m==='deep');
    pop.hidden=isDeep; deep.hidden=!isDeep;
    bp.classList.toggle('on',!isDeep); bd.classList.toggle('on',isDeep);
    try{localStorage.setItem('ll-mode',m);}catch(e){}
  }
  bp.addEventListener('click',function(){set('pop');});
  bd.addEventListener('click',function(){set('deep');});
  var saved=null; try{saved=localStorage.getItem('ll-mode');}catch(e){}
  set(saved==='deep'?'deep':'pop');
})();
</script>
</body></html>
